name: Docker

# Builds the container image, pushes it to GHCR on main (and version tags), and
# gates every run on Trivy CVE scans (image + IaC config). A nightly schedule
# rebuilds against the latest patched base images and re-scans, so base-image
# CVEs get caught and fixed without waiting for a code change.
#
# Trivy runs as the official `aquasec/trivy` Docker image pinned by digest
# policy (aquasec/trivy-action was supply-chain compromised in 2026 — CVE-2026-26189
# and the March 2026 tag force-push — so we avoid that action entirely).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly rebuild + CVE rescan

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build · CVE scan · push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern=nightly

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true # also load locally so Trivy can scan the exact image
          tags: ${{ steps.meta.outputs.tags }},metacache:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: trivy-cache
          key: trivy-${{ runner.os }}-0.57.1

      - name: Trivy — image CVE scan (gate)
        # Fails the run on HIGH/CRITICAL fixable CVEs in the image (base image +
        # published app); SARIF still uploads for code scanning on a failure.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/scan" \
            -v "${{ github.workspace }}/trivy-cache:/root/.cache" \
            -w /scan \
            aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output /scan/trivy-image.sarif \
            --exit-code 1 \
            metacache:ci

      - name: Trivy — IaC/config scan (Dockerfile, compose)
        # Misconfiguration gate: non-root USER, secret baking, etc. (AVD rules).
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v "${{ github.workspace }}/trivy-cache:/root/.cache" \
            -w /src \
            aquasec/trivy:0.57.1 config \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /src/trivy-config.sarif \
            --exit-code 1 \
            .

      - name: Upload Trivy SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Upload Trivy SARIF (config)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
