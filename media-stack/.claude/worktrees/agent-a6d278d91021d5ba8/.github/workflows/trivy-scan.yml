name: Trivy Image Security Scan

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.github/workflows/trivy-scan.yml'
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
  schedule:
    # Weekly scan (Sunday 2 AM UTC)
    - cron: '0 2 * * 0'

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan Images for CVEs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract images from docker-compose.yml
        id: images
        run: |
          images=$(grep -oP '^\s+image:\s+\K[^@\n]+' docker-compose.yml | sort -u | tr '\n' ' ')
          echo "list=$images" >> $GITHUB_OUTPUT

      - name: Run Trivy scan on all images
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: ${{ steps.images.outputs.list }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-image-scan'

      - name: Parse scan results and fail on CRITICAL
        if: always()
        run: |
          CRITICAL_COUNT=$(jq '[.runs[].results[] | select(.level=="error")] | length' trivy-results.sarif 2>/dev/null || echo 0)
          echo "CRITICAL CVEs found: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ CRITICAL CVEs detected - PR merge BLOCKED"
            exit 1
          else
            echo "✅ No CRITICAL CVEs found - PR can merge"
            exit 0
          fi

  report:
    runs-on: ubuntu-latest
    name: Generate CVE Report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master

      - name: Run baseline scan
        run: |
          chmod +x ./scripts/trivy-scan.sh
          ./scripts/trivy-scan.sh || true  # Don't fail main branch scan

      - name: Commit report if changed
        run: |
          git config user.name "Trivy Scanner Bot"
          git config user.email "trivy@bot.local"
          git add STAGE-4-CVE-BASELINE.md || true
          git diff --staged --quiet || git commit -m "docs: update CVE baseline scan report" || true
          git push || echo "No changes to push"

  notify:
    runs-on: ubuntu-latest
    name: Notify on HIGH/CRITICAL
    if: always()
    needs: scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract images and scan for HIGH+CRITICAL
        run: |
          images=$(grep -oP '^\s+image:\s+\K[^@\n]+' docker-compose.yml | sort -u)
          HIGH_TOTAL=0
          CRITICAL_TOTAL=0
          
          for image in $images; do
            trivy image --format json --severity HIGH,CRITICAL "$image" 2>/dev/null | \
              jq '.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH") | .Severity' | wc -l | xargs -I {} sh -c 'HIGH_TOTAL=$((HIGH_TOTAL + {}))'
          done
          
          echo "HIGH_VULNERABILITIES=$HIGH_TOTAL" >> $GITHUB_ENV
          echo "CRITICAL_VULNERABILITIES=$CRITICAL_TOTAL" >> $GITHUB_ENV

      - name: Post to Discord (if configured)
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          payload: |
            {
              "text": "🔍 Trivy Image Scan Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Weekly Image CVE Scan*\n\n:red_circle: CRITICAL: ${{ env.CRITICAL_VULNERABILITIES }}\n:orange_circle: HIGH: ${{ env.HIGH_VULNERABILITIES }}"
                  }
                }
              ]
            }
