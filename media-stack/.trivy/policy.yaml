# Trivy Policy Configuration
# Defines which CVE severities block merges, notify, or allow

---
version: "2024-01"

# Global settings
metadata:
  severity: CRITICAL,HIGH,MEDIUM,LOW
  include-dev-deps: true
  include-deprecated: true
  
# CVE blocking policy
policies:
  
  # CRITICAL CVEs ALWAYS block merge
  - name: "CRITICAL CVEs"
    description: "CRITICAL severity vulnerabilities block all PRs and main branch pushes"
    rego: |
      package trivy
      
      deny[msg] {
          severity := input.Results[_].Vulnerabilities[_].Severity
          severity == "CRITICAL"
          msg := sprintf("CRITICAL CVE found: %v", [severity])
      }
    actions:
      on-pass: ignore
      on-fail: block  # Blocks merge

  # HIGH CVEs notify but allow
  - name: "HIGH CVEs"
    description: "HIGH severity vulnerabilities notify via Discord but allow merge"
    rego: |
      package trivy
      
      warn[msg] {
          severity := input.Results[_].Vulnerabilities[_].Severity
          severity == "HIGH"
          msg := sprintf("HIGH CVE found: %v", [severity])
      }
    actions:
      on-pass: ignore
      on-fail: warn   # Posts comment, allows merge

  # MEDIUM+ tracked in dashboard
  - name: "MEDIUM and below"
    description: "MEDIUM and below are tracked in Grafana but don't block"
    rego: |
      package trivy
      
      info[msg] {
          severity := input.Results[_].Vulnerabilities[_].Severity
          severity == "MEDIUM"
          msg := sprintf("MEDIUM CVE found: %v", [severity])
      }
      
      info[msg] {
          severity := input.Results[_].Vulnerabilities[_].Severity
          severity == "LOW"
          msg := sprintf("LOW CVE found: %v", [severity])
      }
    actions:
      on-pass: ignore
      on-fail: info   # Logs only, allows merge

# Exceptions (allow specific CVEs for valid business reasons)
exceptions:
  
  # Example: If a library has a CRITICAL CVE but it's not exploitable in our context
  # Uncomment and add CVE ID when needed
  # - cve_id: CVE-2024-12345
  #   package: "example-package"
  #   reason: "Not exploitable in our read-only use case"
  #   expires: "2025-01-01"

# Image scanning settings
images:
  
  # Images that are frequently scanned (our 15 services)
  registry-whitelist:
    - docker.io
    - ghcr.io
    - quay.io
    - grafana/
    - hotio/
    - linuxserver/
    - aquaproj/

  # Skip scanning test images
  skip-patterns:
    - "*:test"
    - "*:dev"
    - "*:debug"

# Report generation
reports:
  
  # Format for GitHub Actions output
  github:
    format: sarif
    output: trivy-results.sarif
    
  # Format for CLI output
  cli:
    format: json
    output: trivy-scan-results.json
    
  # Format for Grafana dashboard
  grafana:
    format: json
    output: trivy-dashboard-data.json

# Severity levels (customize if needed)
severity:
  critical: 9.0-10.0   # CVSS 9.0-10.0
  high: 7.0-8.9        # CVSS 7.0-8.9
  medium: 4.0-6.9      # CVSS 4.0-6.9
  low: 0.1-3.9         # CVSS 0.1-3.9

# Notification settings
notifications:
  
  # Discord webhook (set via GitHub Actions secret)
  discord:
    enabled: true
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    on: ["CRITICAL", "HIGH"]
    
  # Email (optional)
  email:
    enabled: false
    to: "security@example.com"
    on: ["CRITICAL"]

# Scanning scope
scope:
  # Always scan these (required)
  required:
    - docker-compose.yml
    
  # Skip if not changed
  optional:
    - .github/workflows/trivy-scan.yml
