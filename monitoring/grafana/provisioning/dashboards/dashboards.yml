# Grafana dashboard provisioning — every JSON file in /var/lib/grafana/dashboards
# is loaded automatically (mount: monitoring/grafana/dashboards).
apiVersion: 1

providers:
  - name: metacache
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
