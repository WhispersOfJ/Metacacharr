name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build · Test · Format · CVE audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Metacache.slnx

      - name: Format (C# style gate)
        run: dotnet format Metacache.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build Metacache.slnx -c Release --no-restore -warnaserror

      - name: Test (with coverage)
        run: dotnet test Metacache.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage artifact
        # Dependabot PRs run with a read-only token, so artifact upload would 403 —
        # skip it there; every gate above still runs on those PRs.
        uses: actions/upload-artifact@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: coverage
          path: TestResults
          if-no-files-found: ignore

      - name: NuGet CVE audit (vulnerable packages)
        # Fails the build when any direct or transitive package has a known
        # vulnerable version (vulnerability data pulled from NuGet.org).
        run: dotnet list Metacache.slnx package --vulnerable --include-transitive
